name: 02 - Manual

on:
  workflow_dispatch:
    inputs:
      logging_level:
        description: 'Nivel de log'
        required: true
        type: choice
        options:
          - info
          - debug
          - warn
          - error
        default: 'info'

      environment:
        description: 'Entorno de despliegue'
        required: true
        type: environment

      dry_run:
        description: 'Ejecutar sin aplicar cambios'
        required: false
        type: boolean
        default: false

      reason:
        description: 'Motivo de la ejecución'
        required: false
        type: string
        default: 'Manual execution'

jobs:
  manual:
    runs-on: ubuntu-24.04
    steps:
      - name: Valores de los inputs
        env:
          LOG_LEVEL: ${{ inputs.logging_level }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "LOG_LEVEL: $LOG_LEVEL"
          echo "ENVIRONMENT: $ENVIRONMENT"
          echo "DRY_RUN: $DRY_RUN"
          echo "REASON: $REASON"

      - name: Deploy
        if: ${{ !inputs.dry_run }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: echo "Deploying to $ENVIRONMENT"

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: echo "Dry run"
