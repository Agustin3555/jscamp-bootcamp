name: 05 - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Con esto cancelamos runs obsoletas del mismo ref (lo que evita trabajo duplicado cuando los push y PR coinciden)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Todos los steps corren desde la raíz, con esto evitamos repetir `cd` en cada paso:
defaults:
  run:
    working-directory: 12-ejercicio-cicd

jobs:
  frontend-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
      - name: Lint
        # run: |
        #   cd 12-ejercicio-cicd
        #   echo "::group::Lint"
        #   pnpm lint:frontend
        #   echo "::endgroup::"
        run: pnpm lint:frontend

  frontend-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
      - name: Test
        # run: |
        #   cd 12-ejercicio-cicd
        #   echo "::group::Test"
        #   pnpm test:frontend
        #   echo "::endgroup::"
        run: pnpm test:frontend

  frontend-build:
    needs: [frontend-lint, frontend-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
      - name: Build
        # run: |
        #   cd 12-ejercicio-cicd
        #   echo "::group::Build"
        #   pnpm build:frontend
        #   echo "::endgroup::"
        run: pnpm build:frontend

  backend-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
      - name: Lint
        # run: |
        #   cd 12-ejercicio-cicd
        #   echo "::group::Lint"
        #   pnpm lint:backend
        #   echo "::endgroup::"
        run: pnpm lint:backend

  backend-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
      - name: Test
        # run: |
        #   cd 12-ejercicio-cicd
        #   echo "::group::Test"
        #   pnpm test:backend
        #   echo "::endgroup::"
        run: pnpm test:backend

  backend-build:
    needs: [backend-lint, backend-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
      - name: Build  # antes decía "Smoke test" por error de copia
        # run: |
        #   cd 12-ejercicio-cicd
        #   echo "::group::Smoke test"
        #   pnpm build:backend
        #   echo "::endgroup::"
        run: pnpm build:backend

  frontend-test-matrix:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-pnpm-ci-cd
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        # run: |
        #   cd 12-ejercicio-cicd
        #   pnpm test:frontend
        run: pnpm test:frontend